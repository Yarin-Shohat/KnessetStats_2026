[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "requests>=2.34.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.61.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
